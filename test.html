<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Mario World - Arcade</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* 🎯 Cadre 4:3 arcade propre */
.wrapper {
  position: relative;
  width: 100vw;
  height: 75vh; /* ratio 4:3 */
  max-width: 133.33vh;
  max-height: 100vh;
  background: black;
  overflow: hidden; /* Rogne le surplus du site */
}

/* 🎮 Zoom et centrage exact sur le jeu */
iframe {
  position: absolute;
  top: -12%;
  left: -2%;
  width: 104%;
  height: 122%;
  border: none;
  display: block;
}
</style>
</head>

<body>

<div class="wrapper">
  <!-- Utilisation de l'URL d'embed officielle pour éviter l'écran noir -->
  <iframe 
    src="https://www.retrogames.cz/embed.php?game=1105-SNES" 
    scrolling="no"
    allowfullscreen
    loading="eager">
  </iframe>
</div>

</body>
</html>
