<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dragon Quest III (English Translated) - SNES</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
}

.wrapper {
  position: relative;
  width: 100vw;
  height: 75vh;
  max-width: 133.33vh;
  max-height: 100vh;
  background: black;
  overflow: hidden;
}

#game {
  width: 100%;
  height: 100%;
}
</style>
</head>

<body>

<div class="wrapper">
  <div id="game"></div>
</div>

<script type="text/javascript">
  EJS_player = '#game';
  EJS_core = 'snes';
  
  // 1. ROM Japonaise officielle
  EJS_gameUrl = 'https://origamidesign.github.io/arcade/dq3_jp.sfc';
  
  // 2. Patch de traduction anglaise (DeJap) appliqué automatiquement au lancement
  EJS_biosUrl = ''; 
  EJS_patchUrl = 'https://origamidesign.github.io/arcade/dq3_en.ips';
  
  EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
  EJS_startOnLoaded = true;
</script>
<script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

</body>
</html>
