<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dragon Quest III - SNES</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* 🎯 Cadre 4:3 arcade propre */
.wrapper {
  position: relative;
  width: 100vw;
  height: 75vh; /* ratio 4:3 */
  max-width: 133.33vh;
  max-height: 100vh;
  background: black;
  overflow: hidden;
}

#game-container {
  width: 100%;
  height: 100%;
}
</style>
</head>

<body>

<div class="wrapper">
  <div id="game-container"></div>
</div>

<script type="text/javascript">
  EJS_player = '#game-container';
  EJS_core = 'snes';
  // ROM du remake Super Nintendo de Dragon Quest III
  EJS_gameUrl = 'https://archive.org/download/snes-romset-translation-english/Dragon%20Quest%20III%20-%20Soshite%20Densetsu%20he...%20%28Japan%29%20%5BTransl._v1.1_by_DeJap%20%26%20Spikeman%5D.zip';
  EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
  EJS_startOnLoaded = true;
</script>
<script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

</body>
</html>
