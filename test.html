<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dragon Quest III - SNES</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
}

.wrapper {
  position: relative;
  width: 100vw;
  height: 75vh;
  max-width: 133.33vh;
  max-height: 100vh;
  background: black;
  overflow: hidden;
}

#game {
  width: 100%;
  height: 100%;
}
</style>
</head>

<body>

<div class="wrapper">
  <div id="game"></div>
</div>

<script type="text/javascript">
  // Calcule l'URL absolue exacte pour eviter les erreurs 404
  var romUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/')) + '/dq3.sfc';

  EJS_player = '#game';
  EJS_core = 'snes';
  EJS_gameUrl = romUrl;
  EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
  EJS_startOnLoaded = true;
</script>
<script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

</body>
</html>
