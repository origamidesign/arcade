<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Mario World - Fullscreen</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* 🎯 Cadre 4:3 arcade propre */
.wrapper {
  position: relative;
  width: 100vw;
  height: 75vh; /* ratio 4:3 */
  max-width: 133.33vh;
  max-height: 100vh;
  background: black;
  overflow: hidden;
}

/* 🎮 Zoom et rognage sur le lecteur autorise */
iframe {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border: none;
  display: block;
}
</style>
</head>

<body>

<div class="wrapper">
  <!-- URL d'embed officielle autorisee sur les sites externes -->
  <iframe 
    src="https://www.retrogames.cc/embed/16847-super-mario-world-usa.html" 
    scrolling="no"
    allowfullscreen
    loading="eager">
  </iframe>
</div>

</body>
</html>
