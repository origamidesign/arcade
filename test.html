<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Mario World - Fullscreen</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* 🎯 cadre 4:3 arcade propre */
.wrapper {
  position: relative;
  width: 100vw;
  height: 75vh; /* ratio 4:3 */
  max-width: 133.33vh;
  max-height: 100vh;
  background: black;
  overflow: hidden; /* Masque les débordements du site */
}

/* 🎮 On agrandit et décale l'iframe pour zoomer uniquement sur le jeu */
iframe {
  position: absolute;
  top: -45px;       /* Masque le titre du haut */
  left: -2px;
  width: calc(100% + 4px);
  height: calc(100% + 45px); /* Compense le décalage du haut */
  border: none;
  display: block;
}
</style>
</head>

<body>

<div class="wrapper">
  <!-- URL modifiée vers la version intégrable /e_ au lieu de /play_ -->
  <iframe src="https://www.retrogames.cz/e_1105-SNES.php" 
    scrolling="no"
    allowfullscreen
    loading="eager">
  </iframe>
</div>

</body>
</html>
