<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
}

  /* 🎯 cadre 8:7 NES natif (256x240) */
.wrapper {
  position: relative;
  height: 100vh;
  width: 114.28vh; /* ratio 8:7 (8 / 7 * 100) */
  max-width: 100vw;
  max-height: 87.5vw; /* sécurité si l'écran est très étroit (7 / 8 * 100) */
  background: black;
}


/* 🎮 iframe full clean */
iframe {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
}
</style>
</head>

<body>

<div class="wrapper">
<iframe src="https://www.retrogames.cc/embed/17923-final-fantasy-usa.html"
    scrolling="no"
    allowfullscreen
    loading="eager">
  </iframe>
</div>

</body>
</html>
